<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RED 10 La Maná — Piloto</title>
<style>
:root{--g:#1B7A3D;--gd:#0F5427;--y:#F2B705;--ink:#1a1a1a;--mut:#666;--line:#e3e3e3;--bg:#f7f7f5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:var(--g);color:#fff;padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
header h1{font-size:20px;letter-spacing:.5px}
header nav button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
header nav button.on{background:#fff;color:var(--gd);border-color:#fff;font-weight:600}
main{max-width:760px;margin:0 auto;padding:18px 14px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.btn{display:inline-block;border:none;border-radius:10px;padding:11px 18px;font-size:15px;cursor:pointer;background:var(--g);color:#fff;font-weight:600}
.btn.sec{background:#fff;color:var(--gd);border:1.5px solid var(--g)}
.btn.dis{background:#ccc;cursor:not-allowed}
.btn.warn{background:#b3261e}
input,select{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;margin:5px 0 12px}
label{font-size:13px;font-weight:600;color:var(--mut)}
h2{font-size:19px;margin-bottom:4px}
.sub{color:var(--mut);font-size:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;border:none}
.hero h2{font-size:26px}
.hero p{opacity:.92;margin:8px 0 14px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:rgba(255,255,255,.14);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;opacity:.85}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:600;padding:6px 8px;border-bottom:2px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
.qrbox{text-align:center}
.qrbox svg{margin:6px auto;background:#fff;padding:10px;border-radius:12px;border:1px solid var(--line)}
.big{font-size:34px;font-weight:700}
.pbar{height:10px;background:#eee;border-radius:99px;overflow:hidden;margin:10px 0 4px}
.pbar i{display:block;height:100%;background:var(--y);transition:width .4s}
.ok{background:#e6f4ea;border:1px solid #b7dfc3;color:var(--gd);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi .card{margin:0;text-align:center;padding:12px}
.kpi .card b{font-size:26px;display:block}
.pill{display:inline-block;background:var(--y);color:var(--ink);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.msg{min-height:20px;font-size:14px;color:var(--gd);font-weight:600;margin:6px 0}
.badge{display:inline-block;background:#eef;border-radius:6px;padding:2px 8px;font-size:12px;color:#334}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px}
@media(max-width:520px){.stats{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
  <h1>RED 10 · La Maná</h1>
  <nav id="nav"></nav>
</header>
<main id="view"></main>
<footer>Piloto RED 10 La Maná · datos almacenados localmente en este dispositivo · Ley de Protección de Datos EC</footer>

<script>
/* ============ MOTOR QR (modo byte, nivel L, v1–v5, máscara 0) — validado ============ */
const EXP=new Array(512),LOG=new Array(256);
(function(){let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&0x100)x^=0x11D;}for(let i=255;i<512;i++)EXP[i]=EXP[i-255];})();
const gmul=(a,b)=>(a===0||b===0)?0:EXP[LOG[a]+LOG[b]];
function rsGen(d){let g=[1];for(let i=0;i<d;i++){const n=[g[0]];for(let j=1;j<g.length;j++)n.push(g[j]^gmul(g[j-1],EXP[i]));n.push(gmul(g[g.length-1],EXP[i]));g=n;}return g;}
function rsEcc(data,d){const g=rsGen(d),res=new Array(d).fill(0);
  for(const b of data){const f=b^res[0];res.shift();res.push(0);
    if(f)for(let j=0;j<d;j++)res[j]^=gmul(g[j+1],f);}return res;}
const CAP={1:[19,7],2:[34,10],3:[55,15],4:[80,20],5:[106,26]};
const ALIGN={1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30]};
function fmtBits(){const v=8,g=0x537;let d=v<<10;
  for(let i=14;i>=10;i--)if((d>>i)&1)d^=g<<(i-10);
  return(((v<<10)|d)^0x5412)&0x7FFF;}
function qrMatrix(bytes){
  const n=bytes.length;
  let v=1;for(const k in CAP){if(n<=CAP[k][0]-2){v=+k;break;}}
  const [dcap,ecc]=CAP[v],size=17+4*v,bits=[];
  const put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>i)&1);};
  put(4,4);put(n,8);for(const b of bytes)put(b,8);
  put(0,Math.min(4,dcap*8-bits.length));
  while(bits.length%8)bits.push(0);
  const cw=[];for(let i=0;i<bits.length;i+=8)cw.push(bits.slice(i,i+8).reduce((a,x)=>(a<<1)|x,0));
  const pads=[0xEC,0x11];let pi=0;while(cw.length<dcap)cw.push(pads[pi^=1]);
  const full=cw.concat(rsEcc(cw,ecc));
  const M=Array.from({length:size},()=>new Array(size).fill(null));
  const finder=(r0,c0)=>{for(let r=-1;r<8;r++)for(let c=-1;c<8;c++){const rr=r0+r,cc=c0+c;
    if(rr>=0&&rr<size&&cc>=0&&cc<size)
      M[rr][cc]=(r>=0&&r<=6&&c>=0&&c<=6)?((r===0||r===6||c===0||c===6||(r>=2&&r<=4&&c>=2&&c<=4))?1:0):0;}};
  finder(0,0);finder(0,size-7);finder(size-7,0);
  for(let i=8;i<size-8;i++){M[6][i]=i%2===0?1:0;M[i][6]=i%2===0?1:0;}
  for(const ar of ALIGN[v])for(const ac of ALIGN[v]){
    if((ar<=8&&ac<=8)||(ar<=8&&ac>=size-9)||(ar>=size-9&&ac<=8))continue;
    for(let r=-2;r<=2;r++)for(let c=-2;c<=2;c++)
      M[ar+r][ac+c]=(Math.max(Math.abs(r),Math.abs(c))!==1)?1:0;}
  M[4*v+9][8]=1;
  const f=fmtBits();
  const fp=[[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
  fp.forEach(([r,c],i)=>M[r][c]=(f>>(14-i))&1);
  const sp=[];for(let i=1;i<=7;i++)sp.push([size-i,8]);
  for(let i=8;i>=1;i--)sp.push([8,size-i]);
  sp.forEach(([r,c],i)=>M[r][c]=(f>>(14-i))&1);
  const db=[];for(const b of full)for(let i=7;i>=0;i--)db.push((b>>i)&1);
  let di=0,up=true,c=size-1;
  while(c>0){if(c===6)c--;const rows=up?[...Array(size).keys()].reverse():[...Array(size).keys()];
    for(const r of rows)for(const cc of[c,c-1])if(M[r][cc]===null){
      const bit=di<db.length?db[di++]:0;M[r][cc]=(r+cc)%2===1?bit:1-bit;}
    up=!up;c-=2;}
  return M;}
function qrSVG(text,scale){
  const M=qrMatrix(Array.from(new TextEncoder().encode(text)));
  const n=M.length,pad=4,s=scale||6,total=(n+pad*2)*s;
  let rects='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(M[r][c])
    rects+='<rect x="'+((c+pad)*s)+'" y="'+((r+pad)*s)+'" width="'+s+'" height="'+s+'"/>';
  return '<svg width="'+total+'" height="'+total+'" viewBox="0 0 '+total+' '+
    total+'" xmlns="http://www.w3.org/2000/svg"><g fill="#111">'+rects+'</g></svg>';}

/* ============ ESTADO / BASE DE DATOS LOCAL ============ */
const SEED_B=[
 {code:'N01',name:'Tienda Doña María',pin:'1111'},
 {code:'N02',name:'Farmacia Central',pin:'1111'},
 {code:'N03',name:'Comedor El Sabroso',pin:'1111'},
 {code:'N04',name:'Panadería La Unión',pin:'1111'},
 {code:'N05',name:'Ferretería El Maestro',pin:'1111'}];
const GOAL=100, BASE_URL='https://r10.ec/u/'; // cámbialo por tu dominio real
let DB=JSON.parse(localStorage.getItem('red10')||'null');
if(!DB){DB={users:[],txs:[],redemptions:[],adminPin:'1010',biz:SEED_B};save();}
function save(){localStorage.setItem('red10',JSON.stringify(DB));}
const code6=()=>{const c='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)];return s;};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const today=()=>new Date().toLocaleDateString('es-EC');
function userPts(u){return DB.txs.filter(t=>t.u===u.code).reduce((a,t)=>a+t.pts,0)-DB.redemptions.filter(r=>r.u===u.code&&r.status!=='anulado').reduce((a,r)=>a+GOAL,0);}

/* ============ NAVEGACIÓN ============ */
const ROUTES={'inicio':vHome,'registro':vReg,'usuario':vWallet,'negocio':vBiz,'admin':vAdmin};
let current='inicio';
function nav(){const n=$('#nav');n.innerHTML='';
  [['inicio','Inicio'],['registro','Registro'],['usuario','Mi billetera'],['negocio','Negocio'],['admin','Admin']]
  .forEach(([r,l])=>{const b=document.createElement('button');b.textContent=l;
    if(r===current)b.className='on';b.onclick=()=>{current=r;render();};n.appendChild(b);});}
function render(){nav();ROUTES[current]();window.scrollTo(0,0);}
function go(r){current=r;render();}

/* ============ VISTAS ============ */
function vHome(){
  const uN=DB.users.length,tN=DB.txs.length,rN=DB.redemptions.length;
  $('#view').innerHTML=`
  <div class="card hero">
    <h2>Compra en tu barrio.<br>Viaja. Gana.</h2>
    <p>Escanea el QR en cada compra, acumula <b>Dieces</b> y canjéalos por
    <b>pasajes con la cooperativa</b> y premios de negocios locales de La Maná.</p>
    <button class="btn" style="background:var(--y);color:#111" onclick="go('registro')">Quiero registrarme</button>
    <button class="btn sec" style="background:#fff" onclick="go('negocio')">Soy negocio</button>
    <div class="stats">
      <div class="stat"><b>${uN}</b><span>vecinos registrados</span></div>
      <div class="stat"><b>${tN}</b><span>compras premiadas</span></div>
      <div class="stat"><b>${rN}</b><span>pasajes canjeados</span></div>
    </div>
  </div>
  <div class="card">
    <h2>¿Cómo funciona?</h2>
    <p class="sub">1) Regístrate gratis · 2) Escanea tu QR al pagar · 3) Acumula Dieces (1 por cada $1) · 4) A los 100, canjea tu pasaje.</p>
    <p class="sub">Promoción de lanzamiento: <span class="pill">DOBLE DIEC</span> — días promocionales con puntos x2.</p>
  </div>
  <div class="card">
    <h2>Negocios del piloto</h2>
    <table><tr><th>Código</th><th>Negocio</th></tr>
    ${DB.biz.map(b=>`<tr><td>${b.code}</td><td>${esc(b.name)}</td></tr>`).join('')}</table>
    <p class="sub" style="margin-top:8px">¿Tu negocio aún no está? Pide tu afiliación en el punto de registro.</p>
  </div>`;}

function vReg(){
  $('#view').innerHTML=`
  <div class="card">
    <h2>Registro de vecino</h2>
    <p class="sub">Gratis, en menos de un minuto. Tus datos se guardan seguros (Ley de Protección de Datos EC).</p>
    <label>Nombre y apellido</label>
    <input id="nm" maxlength="60" placeholder="Ej. María Quito">
    <label>Teléfono / WhatsApp</label>
    <input id="ph" maxlength="15" placeholder="09xxxxxxxx">
    <div class="msg" id="m"></div>
    <button class="btn" onclick="doReg()">Crear mi billetera</button>
  </div>`;}
function doReg(){
  const nm=$('#nm').value.trim(),ph=$('#ph').value.trim();
  if(nm.length<3||ph.length<7){$('#m').textContent='Completa nombre y teléfono válidos.';return;}
  let code=code6();while(DB.users.some(u=>u.code===code))code=code6();
  DB.users.push({code,name:nm,phone:ph,created:today()});save();
  sessionStorage.setItem('red10me',code);go('usuario');}

function vWallet(){
  const me=sessionStorage.getItem('red10me');
  const u=DB.users.find(x=>x.code===me);
  if(!u){$('#view').innerHTML=`<div class="card"><h2>Billetera</h2><p class="sub">Aún no te has registrado.</p><button class="btn" onclick="go('registro')">Registrarme</button></div>`;return;}
  const pts=userPts(u),pct=Math.min(100,pts),myT=DB.txs.filter(t=>t.u===u.code).slice(-6).reverse();
  const myR=DB.redemptions.filter(r=>r.u===u.code).slice(-3).reverse();
  const url=BASE_URL+u.code;
  $('#view').innerHTML=`
  <div class="card qrbox">
    <h2>Hola, ${esc(u.name.split(' ')[0])}</h2>
    <p class="sub">Muestra este código al pagar en cualquier negocio de la red</p>
    ${qrSVG(url,6)}
    <div class="badge">Tu código: ${u.code}</div>
    <p class="sub" style="margin-top:6px">${url}</p>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <h2>Tus Dieces</h2><div class="big">${pts}</div>
    </div>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <p class="sub">${pts>=GOAL?'¡Tienes un pasaje disponible!':`Te faltan ${GOAL-pts} Dieces para un pasaje (${GOAL}).`}</p>
    <button class="btn ${pts>=GOAL?'':'dis'}" ${pts>=GOAL?'':'disabled'} onclick="doRedeem()">Canjear 100 Dieces por un PASAJE</button>
    <div class="msg" id="m"></div>
    ${myR.map(r=>`<div class="ok">Boleto <b>${r.voucher}</b> — ${r.status==='usado'?'usado ✓':'válido, preséntalo en la cooperativa'}</div>`).join('')}
  </div>
  <div class="card">
    <h2>Mis últimas compras</h2>
    <table><tr><th>Fecha</th><th>Negocio</th><th>$</th><th>Dieces</th></tr>
    ${myT.length?myT.map(t=>`<tr><td>${t.d}</td><td>${esc(t.bn)}</td><td>${t.amt}</td><td>+${t.pts}</td></tr>`).join(''):'<tr><td colspan="4">Sin movimientos todavía.</td></tr>'}</table>
  </div>`;}
function doRedeem(){
  const me=sessionStorage.getItem('red10me'),u=DB.users.find(x=>x.code===me);
  if(userPts(u)<GOAL)return;
  let v='R10-'+code6().slice(0,6);
  DB.redemptions.push({voucher:v,u:u.code,date:today(),status:'válido'});save();render();}

function vBiz(){
  const pre=new URLSearchParams(location.search).get('u');
  $('#view').innerHTML=`
  <div class="card">
    <h2>Panel de negocio</h2>
    <p class="sub">Acredita Dieces al escanear el código del cliente (o ingrésalo manualmente).</p>
    <label>Negocio</label>
    <select id="bc">${DB.biz.map(b=>`<option value="${b.code}">${esc(b.name)}</option>`).join('')}</select>
    <label>Código del cliente (8 caracteres) o lee el QR con la cámara</label>
    <input id="uc" maxlength="8" style="text-transform:uppercase" value="${pre?esc(pre):''}" placeholder="Ej. K7Q2M8Z4">
    <label>Monto de la compra ($)</label>
    <input id="amt" type="number" min="1" step="1" placeholder="Ej. 8">
    <label style="display:flex;align-items:center;gap:8px;font-weight:400">
      <input type="checkbox" id="dbl" style="width:auto;margin:0"> Día promocional DOBLE DIEC (x2)</label>
    <div class="msg" id="m"></div>
    <button class="btn" onclick="doAward()">Acreditar Dieces</button>
  </div>
  <div class="card">
    <h2>Últimas acreditaciones</h2>
    <table><tr><th>Fecha</th><th>Negocio</th><th>Cliente</th><th>$</th><th>Dieces</th></tr>
    ${DB.txs.slice(-8).reverse().map(t=>`<tr><td>${t.d}</td><td>${esc(t.bn)}</td><td>${t.u}</td><td>${t.amt}</td><td>+${t.pts}</td></tr>`).join('')||'<tr><td colspan="5">Sin movimientos.</td></tr>'}</table>
  </div>`;}
function doAward(){
  const bc=$('#bc').value,uc=$('#uc').value.trim().toUpperCase(),amt=parseInt($('#amt').value,10);
  const u=DB.users.find(x=>x.code===uc);
  if(!u){$('#m').textContent='Código de cliente no encontrado.';return;}
  if(!amt||amt<1){$('#m').textContent='Ingresa un monto válido (mínimo $1).';return;}
  let pts=amt*($('#dbl').checked?2:1);
  DB.txs.push({u:uc,b:bc,bn:DB.biz.find(b=>b.code===bc).name,amt,pts,d:today()});save();
  $('#m').textContent=`✓ ${pts} Dieces acreditados a ${u.name}.`;
  $('#uc').value='';$('#amt').value='';}

function vAdmin(){
  const pin=prompt('PIN de administrador (demo: 1010):');
  if(pin!==DB.adminPin){$('#view').innerHTML='<div class="card"><h2>Acceso denegado</h2></div>';return;}
  const ptsIssued=DB.txs.reduce((a,t)=>a+t.pts,0);
  const txsToday=DB.txs.filter(t=>t.d===today()).length;
  $('#view').innerHTML=`
  <div class="kpi">
    <div class="card"><b>${DB.users.length}</b>usuarios</div>
    <div class="card"><b>${txsToday}</b>compras hoy</div>
    <div class="card"><b>${ptsIssued}</b>Dieces emitidos</div>
    <div class="card"><b>${DB.redemptions.length}</b>boletos emitidos</div>
  </div>
  <div class="card">
    <h2>Validar boleto de la cooperativa</h2>
    <input id="vv" maxlength="10" placeholder="R10-XXXXXX" style="text-transform:uppercase">
    <button class="btn" onclick="useVoucher()">Marcar como usado</button>
    <div class="msg" id="vm"></div>
  </div>
  <div class="card">
    <h2>Boletos emitidos</h2>
    <table><tr><th>Boleto</th><th>Cliente</th><th>Fecha</th><th>Estado</th></tr>
    ${DB.redemptions.map(r=>`<tr><td>${r.voucher}</td><td>${r.u}</td><td>${r.date}</td><td>${r.status}</td></tr>`).join('')||'<tr><td colspan="4">Ninguno aún.</td></tr>'}</table>
  </div>
  <div class="card">
    <h2>Transacciones</h2>
    <table><tr><th>Fecha</th><th>Negocio</th><th>Cliente</th><th>$</th><th>Dieces</th></tr>
    ${DB.txs.slice(-15).reverse().map(t=>`<tr><td>${t.d}</td><td>${esc(t.bn)}</td><td>${t.u}</td><td>${t.amt}</td><td>${t.pts}</td></tr>`).join('')}</table>
    <p style="margin-top:10px"><button class="btn sec" onclick="exportCSV()">Exportar CSV</button>
    <button class="btn warn" onclick="if(confirm('¿Borrar TODO el piloto?')){localStorage.removeItem('red10');location.reload();}">Reiniciar piloto</button></p>
  </div>`;}
function useVoucher(){
  const v=$('#vv').value.trim().toUpperCase();
  const r=DB.redemptions.find(x=>x.voucher.toUpperCase()===v);
  if(!r){$('#vm').textContent='Boleto no encontrado.';return;}
  r.status='usado';save();$('#vm').textContent='✓ Boleto '+v+' marcado como usado.';}
function exportCSV(){
  let csv='fecha,negocio,cliente,monto,dieces\n'+DB.txs.map(t=>[t.d,t.bn,t.u,t.amt,t.pts].join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='red10_piloto.csv';a.click();}

/* ============ ARRANQUE ============ */
const preUser=new URLSearchParams(location.search).get('u');
if(preUser){current='negocio';}
render();
</script>
</body>
</html>
